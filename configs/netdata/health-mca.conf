# Custom alarms. Visible in the dashboard and in /api/v1/alarms (phone dashboard).
# mca.on_battery is sent by /usr/local/sbin/mca-hw-watch (statsd gauge, 1 = running on battery).

 alarm: mca_on_battery
    on: statsd_mca.on_battery_gauge
lookup: max -20s unaligned
 units: boolean
 every: 5s
  crit: $this == 1
  info: AC power lost, the server runs on the battery
    to: silent   # push comes from mca-alert, avoid duplicates

 alarm: mca_cpu_temp
    on: sensors.temperature_k10temp-pci-00c3_temp1_Tctl_input
lookup: average -1m unaligned of input
 units: Celsius
 every: 10s
  warn: $this > 85
  crit: $this > 92
 delay: down 5m multiplier 1.5 max 1h
  info: CPU temperature (Tctl) is high
    to: silent   # push comes from mca-alert, avoid duplicates

 alarm: mca_wifi_down
    on: net_operstate.wlo1
lookup: max -30s unaligned of up
 units: boolean
 every: 10s
  crit: $this == 0
  info: Wi-Fi interface wlo1 is not up (only visible locally, a remote phone loses the connection anyway)
    to: silent   # push comes from mca-alert, avoid duplicates

 alarm: mca_backup_age
    on: statsd_mca.backup_age_h_gauge
lookup: max -2m unaligned
 units: hours
 every: 1m
  warn: $this > 30
  crit: $this > 54
 delay: down 10m multiplier 1.5 max 1h
  info: The last successful backup to the external SSD is older than expected (nightly job 03:30, see /usr/local/sbin/mca-backup)
    to: sysadmin
