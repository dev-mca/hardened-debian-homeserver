# Sanitized copy of ~/docker/minecraft/docker-compose.yml.
# The RCON password comes from a local .env file (mode 600, not in this repo).
# RCON port 25575 is NOT published, it is reachable only inside the compose network.
services:
  mc:
    image: itzg/minecraft-server:java25   # variant is pinned, the build behind the tag is not
    container_name: minecraft
    ports:
      - "25565:25565"          # the only port that is open to the internet
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"          # pinned Minecraft version
      MEMORY: "3G"
      TZ: "<TIMEZONE>"
      MOTD: "<MOTD>"
      DIFFICULTY: "normal"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "10"
      MODE: "survival"
      HARDCORE: "FALSE"
      ONLINE_MODE: "TRUE"      # players must have a valid Minecraft account
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: "<PLAYER_1>,<PLAYER_2>,<PLAYER_3>"
      # No operators, so no cheats. Admin work goes through: sudo docker exec minecraft rcon-cli <command>
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      # Autopause: the JVM is frozen (SIGSTOP) after 30 min without players and woken by a connection attempt.
      # RAM stays reserved while paused.
      ENABLE_AUTOPAUSE: "TRUE"
      MAX_TICK_TIME: "-1"
      JVM_DD_OPTS: "disable.watchdog:true"   # the Paper watchdog would kill the server after a long pause
      AUTOPAUSE_TIMEOUT_EST: "1800"
    cap_add:
      - NET_RAW                # needed by knockd (autopause)
    volumes:
      - ./data:/data
    restart: unless-stopped

  backup:
    image: itzg/mc-backup:latest   # tag not pinned
    container_name: minecraft-backup
    depends_on:
      - mc
    environment:
      RCON_HOST: "mc"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      BACKUP_INTERVAL: "24h"
      INITIAL_DELAY: "10m"
      PRUNE_BACKUPS_DAYS: "7"
      PAUSE_IF_NO_PLAYERS: "true"
      TZ: "<TIMEZONE>"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    restart: unless-stopped
