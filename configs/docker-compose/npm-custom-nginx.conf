# Sanitized copy of the two custom nginx snippets of Nginx Proxy Manager
# (data/nginx/custom/http_top.conf and server_proxy.conf).
# Purpose: requests from outside the LAN and Tailscale get 403 for hosts listed in the map.

# --- http_top.conf ---
geo $is_lan {
    default        0;
    192.0.2.0/24   1;
    127.0.0.0/8    1;
    100.64.0.0/10  1;   # Tailscale IPv4 range
    <TAILSCALE_IPV6_PREFIX> 1;   # Tailscale IPv6 range
}
map "$host:$is_lan" $lan_only_block {
    default                0;
    "cloud.home.arpa:0"    1;   # internal name of the cloud storage (reserved .arpa name, not a real domain)
}

# --- server_proxy.conf ---
if ($lan_only_block) { return 403; }
